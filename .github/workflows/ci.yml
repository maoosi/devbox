name: ci

# Cheap checks on every push/PR: typecheck + unit tests across the workspace.
# The expensive Docker smoke runs live in smoke-ubuntu.yml (manual dispatch).
on:
  push:
    branches: [main, next]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test packages/core/tests packages/ubuntu/tests/unit packages/upstash/tests
